name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://viralground.kr
          NEXT_PUBLIC_API_URL: https://api.viralground.kr
          NEXT_PUBLIC_STORAGE_ORIGINS: https://storage.viralground.kr
          NEXT_PUBLIC_CALENDLY_URL: https://calendly.com/viralground-ci/intro
          NEXT_PUBLIC_LEGAL_TERMS_VERSION: terms-ci-2026-08-13
          NEXT_PUBLIC_LEGAL_PRIVACY_VERSION: privacy-ci-2026-08-13
          NEXT_PUBLIC_LEGAL_AGE14_VERSION: age14-ci-2026-08-13
          NEXT_PUBLIC_LEGAL_CREATOR_THIRD_PARTY_VERSION: third-party-ci-2026-08-13
          NEXT_PUBLIC_LEGAL_MARKETING_VERSION: marketing-ci-2026-08-13
          NEXT_PUBLIC_PRIVACY_OFFICER_NAME: ViralGround Privacy Officer
          NEXT_PUBLIC_PRIVACY_OFFICER_CONTACT: privacy@viralground.kr
          NEXT_PUBLIC_SENTRY_DSN: https://0123456789abcdef@o123.ingest.sentry.io/1
          NEXT_PUBLIC_SENTRY_ENV: ci
      - name: Reject high-severity production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Upload test coverage and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-reports
          path: |
            coverage/**
            test-results/**
          if-no-files-found: ignore
          retention-days: 14
